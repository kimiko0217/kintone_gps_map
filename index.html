<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { width: 100vw; height: 100vh; }
    #no-data {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-size: 1.5rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var points = <?!= pointsJson ?>;

    if (points.length === 0) {
      document.getElementById('map').innerHTML = '<div id="no-data">データがありません</div>';
    } else {
      var last = points[points.length - 1];
      var map = L.map('map').setView([last.lat, last.lng], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      function formatDatetime(iso) {
        if (!iso) return '';
        var jst = new Date(new Date(iso).getTime() + 9 * 60 * 60 * 1000);
        var y  = jst.getUTCFullYear();
        var mo = ('0' + (jst.getUTCMonth() + 1)).slice(-2);
        var d  = ('0' + jst.getUTCDate()).slice(-2);
        var h  = ('0' + jst.getUTCHours()).slice(-2);
        var mi = ('0' + jst.getUTCMinutes()).slice(-2);
        return y + '/' + mo + '/' + d + ' ' + h + ':' + mi;
      }

      function formatKey(key) {
        if (!key || key.length < 12) return '';
        return key.slice(0,4) + '/' + key.slice(4,6) + '/' + key.slice(6,8) + ' ' + key.slice(8,10) + ':' + key.slice(10,12);
      }

      function lerpColor(t) {
        const from = { r: 0x1a, g: 0x6f, b: 0xcc };
        const to   = { r: 0xcc, g: 0x1a, b: 0x1a };
        const r = Math.round(from.r + (to.r - from.r) * t);
        const g = Math.round(from.g + (to.g - from.g) * t);
        const b = Math.round(from.b + (to.b - from.b) * t);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }

      var now = new Date();

      points.forEach(function(p, i) {
        var color;
        if (p.name) {
          color = 'orange';
        } else {
          var t = 0;
          if (p.datetime) {
            var ageMin = (now - new Date(p.datetime)) / 60000;
            t = Math.min(1, Math.max(0, (60 - ageMin) / 55));
          }
          color = lerpColor(t);
        }

        var marker = L.circleMarker([p.lat, p.lng], {
          radius: 6,
          color: color,
          fillColor: color,
          fillOpacity: 0.8
        }).addTo(map);

        var datetimeStr = p.datetime ? formatDatetime(p.datetime) : formatKey(p.key);
        var popupLines = [];
        if (datetimeStr) popupLines.push(datetimeStr);
        if (p.name) {
          popupLines.push(p.name);
          popupLines.push('<a href="https://www.google.com/maps/search/?api=1&query=道の駅+' + encodeURIComponent(p.name) + '" target="_blank">Googleマップで見る</a>');
        }
        marker.bindPopup(popupLines.join('<br>'));
      });
    }
  </script>
</body>
</html>
