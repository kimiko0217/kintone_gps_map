<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { width: 100vw; height: 100vh; }
    #no-data {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-size: 1.5rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var points = <?!= pointsJson ?>;

    if (points.length === 0) {
      document.getElementById('map').innerHTML = '<div id="no-data">データがありません</div>';
    } else {
      var last = points[points.length - 1];
      var map = L.map('map').setView([last.lat, last.lng], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      function formatDatetime(iso) {
        if (!iso) return '';
        var jst = new Date(new Date(iso).getTime() + 9 * 60 * 60 * 1000);
        var y  = jst.getUTCFullYear();
        var mo = ('0' + (jst.getUTCMonth() + 1)).slice(-2);
        var d  = ('0' + jst.getUTCDate()).slice(-2);
        var h  = ('0' + jst.getUTCHours()).slice(-2);
        var mi = ('0' + jst.getUTCMinutes()).slice(-2);
        return y + '/' + mo + '/' + d + ' ' + h + ':' + mi;
      }

      function formatKey(key) {
        if (!key || key.length < 12) return '';
        return key.slice(0,4) + '/' + key.slice(4,6) + '/' + key.slice(6,8) + ' ' + key.slice(8,10) + ':' + key.slice(10,12);
      }

      var now = new Date();

      points.forEach(function(p, i) {
        var color;
        if (p.name) {
          color = 'OrangeRed';
        } else {
          // 日単位グラデーション: Grey(#808080)→blue(#1a6fcc)、3日で完全グレー
          var tDay = Math.max(0, 1 - p.daysAgo / 3);
          var r = Math.round(0x80 + (0x1a - 0x80) * tDay);
          var g = Math.round(0x80 + (0x6f - 0x80) * tDay);
          var b = Math.round(0x80 + (0xcc - 0x80) * tDay);

          // 時間グラデーション: 現在時刻からの経過分で色を決定（180分以降は日単位色）
          if (p.datetime) {
            var ageMin = (now - new Date(p.datetime)) / 60000;
            if (ageMin >= 0 && ageMin < 180) {
              var red    = [0xcc, 0x1a, 0x1a];
              var yellow = [0xcc, 0xcc, 0x00];
              var green  = [0x1a, 0xcc, 0x1a];
              var day    = [r, g, b];
              var seg, c1, c2;
              if      (ageMin < 30)  { c1 = red;    c2 = red;    seg = 0; }
              else if (ageMin < 60)  { c1 = red;    c2 = yellow; seg = (ageMin - 30) / 30; }
              else if (ageMin < 90)  { c1 = yellow; c2 = yellow; seg = 0; }
              else if (ageMin < 120) { c1 = yellow; c2 = green;  seg = (ageMin - 90) / 30; }
              else if (ageMin < 150) { c1 = green;  c2 = green;  seg = 0; }
              else                   { c1 = green;  c2 = day;    seg = (ageMin - 150) / 30; }
              r = Math.round(c1[0] + (c2[0] - c1[0]) * seg);
              g = Math.round(c1[1] + (c2[1] - c1[1]) * seg);
              b = Math.round(c1[2] + (c2[2] - c1[2]) * seg);
            }
          }
          color = 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        var marker;
        if (p.name) {
          marker = L.marker([p.lat, p.lng], {
            icon: L.icon({
              iconUrl: 'https://raw.githubusercontent.com/kimiko0217/kintone_gps_map/main/images/michinoeki.png',
              iconSize: [16, 16],
              iconAnchor: [8, 8],
              popupAnchor: [0, -8]
            })
          }).addTo(map);
        } else {
          marker = L.circleMarker([p.lat, p.lng], {
            radius: 6,
            color: color,
            fillColor: color,
            fillOpacity: 0.8
          }).addTo(map);
        }

        var datetimeStr = p.datetime ? formatDatetime(p.datetime) : formatKey(p.key);
        var popupLines = [];
        if (datetimeStr) popupLines.push(datetimeStr);
        if (p.name) {
          popupLines.push('道の駅 ' + p.name);
          popupLines.push('<a href="https://www.google.com/maps/search/?api=1&query=道の駅+' + encodeURIComponent(p.name) + '" target="_blank">Googleマップで見る</a>');
        }
        marker.bindPopup(popupLines.join('<br>'));
      });
    }
  </script>
</body>
</html>
