<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GPS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { width: 100vw; height: 100vh; }
    #no-data {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-size: 1.5rem;
      color: #666;
    }
    .mode-ctrl { display: flex; }
    .mode-ctrl button {
      padding: 0 12px;
      height: 36px;
      background: white;
      border: 1px solid #bbb;
      cursor: pointer;
      font-size: 13px;
      min-width: 58px;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .mode-ctrl button:not(:last-child) { border-right: none; }
    .mode-ctrl button:first-child { border-radius: 4px 0 0 4px; }
    .mode-ctrl button:last-child  { border-radius: 0 4px 4px 0; }
    .mode-ctrl button.active {
      background: #1a6fcc;
      color: white;
      border-color: #1a6fcc;
    }
    @media (max-width: 768px) {
      .mode-ctrl button {
        height: 88px;
        font-size: 30px;
        min-width: 132px;
        padding: 0 28px;
      }
    }
    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.6;
    }
    .leaflet-popup-content a { color: #1a6fcc; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var points = <?!= pointsJson ?>;

    if (points.length === 0) {
      document.getElementById('map').innerHTML = '<div id="no-data">データがありません</div>';
    } else {
      var last = points[points.length - 1];
      var isMobile = window.screen.width <= 768;
      var initialZoom  = isMobile ? 17 : 15;
      var markerRadius = isMobile ? 18 : 7;
      var iconSize     = isMobile ? 48 : 18;
      var iconAnchor   = isMobile ? 24 : 9;
      var popupAnchor  = isMobile ? -24 : -9;

      var map = L.map('map').setView([last.lat, last.lng], initialZoom);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      function formatDatetime(iso) {
        if (!iso) return '';
        var jst = new Date(new Date(iso).getTime() + 9 * 60 * 60 * 1000);
        var y  = jst.getUTCFullYear();
        var mo = ('0' + (jst.getUTCMonth() + 1)).slice(-2);
        var d  = ('0' + jst.getUTCDate()).slice(-2);
        var h  = ('0' + jst.getUTCHours()).slice(-2);
        var mi = ('0' + jst.getUTCMinutes()).slice(-2);
        return y + '/' + mo + '/' + d + ' ' + h + ':' + mi;
      }

      function formatKey(key) {
        if (!key || key.length < 12) return '';
        return key.slice(0,4) + '/' + key.slice(4,6) + '/' + key.slice(6,8) + ' ' + key.slice(8,10) + ':' + key.slice(10,12);
      }

      var now = new Date();
      var layerToday = L.layerGroup();
      var layerWeek  = L.layerGroup();
      var layerAll   = L.layerGroup();

      function makeColor(p) {
        var tDay = Math.max(0, 1 - p.daysAgo / 3);
        var r = Math.round(0x80 + (0x1a - 0x80) * tDay);
        var g = Math.round(0x80 + (0x6f - 0x80) * tDay);
        var b = Math.round(0x80 + (0xcc - 0x80) * tDay);
        if (p.datetime) {
          var ageMin = (now - new Date(p.datetime)) / 60000;
          if (ageMin >= 0 && ageMin < 180) {
            var red    = [0xcc, 0x1a, 0x1a];
            var yellow = [0xcc, 0xcc, 0x00];
            var green  = [0x1a, 0xcc, 0x1a];
            var day    = [r, g, b];
            var seg, c1, c2;
            if      (ageMin < 30)  { c1 = red;    c2 = red;    seg = 0; }
            else if (ageMin < 60)  { c1 = red;    c2 = yellow; seg = (ageMin - 30) / 30; }
            else if (ageMin < 90)  { c1 = yellow; c2 = yellow; seg = 0; }
            else if (ageMin < 120) { c1 = yellow; c2 = green;  seg = (ageMin - 90) / 30; }
            else if (ageMin < 150) { c1 = green;  c2 = green;  seg = 0; }
            else                   { c1 = green;  c2 = day;    seg = (ageMin - 150) / 30; }
            r = Math.round(c1[0] + (c2[0] - c1[0]) * seg);
            g = Math.round(c1[1] + (c2[1] - c1[1]) * seg);
            b = Math.round(c1[2] + (c2[2] - c1[2]) * seg);
          }
        }
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }

      points.forEach(function(p) {
        var marker;
        if (p.name) {
          marker = L.marker([p.lat, p.lng], {
            icon: L.icon({
              iconUrl: 'https://raw.githubusercontent.com/kimiko0217/kintone_gps_map/main/images/michinoeki.png',
              iconSize: [iconSize, iconSize],
              iconAnchor: [iconAnchor, iconAnchor],
              popupAnchor: [0, popupAnchor]
            })
          });
        } else {
          var color = makeColor(p);
          marker = L.circleMarker([p.lat, p.lng], {
            radius: markerRadius,
            color: color,
            fillColor: color,
            fillOpacity: 0.8
          });
        }

        var datetimeStr = p.datetime ? formatDatetime(p.datetime) : formatKey(p.key);
        var popupLines = [];
        if (datetimeStr) popupLines.push(datetimeStr);
        if (p.name) {
          popupLines.push('道の駅 ' + p.name);
          popupLines.push('<a href="https://www.google.com/maps/search/?api=1&query=道の駅+' + encodeURIComponent(p.name) + '" target="_blank">Googleマップで見る</a>');
        }
        marker.bindPopup(popupLines.join('<br>'));

        layerAll.addLayer(marker);
        if (p.daysAgo <= 6) layerWeek.addLayer(marker);
        if (p.daysAgo === 0) layerToday.addLayer(marker);
      });

      var layers = [layerToday, layerWeek, layerAll];
      var currentMode = 0;
      layers[currentMode].addTo(map);

      // Leafletコントロールとしてボタンを追加
      var ModeControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function() {
          var div = L.DomUtil.create('div', 'mode-ctrl');
          div.innerHTML =
            '<button data-mode="0" class="active">当日のみ</button>' +
            '<button data-mode="1">1週間</button>' +
            '<button data-mode="2">4週間</button>';
          L.DomEvent.disableClickPropagation(div);
          if (isMobile) {
            div.querySelectorAll('button').forEach(function(btn) {
              btn.style.height = 'auto';
              btn.style.fontSize = '45px';
              btn.style.minWidth = '0';
              btn.style.padding = '24px';
            });
          }
          div.querySelectorAll('button').forEach(function(btn) {
            L.DomEvent.on(btn, 'click', function() {
              map.removeLayer(layers[currentMode]);
              currentMode = parseInt(btn.dataset.mode);
              layers[currentMode].addTo(map);
              div.querySelectorAll('button').forEach(function(b) {
                b.classList.toggle('active', parseInt(b.dataset.mode) === currentMode);
              });
            });
          });
          return div;
        }
      });
      map.addControl(new ModeControl());
    }
  </script>
</body>
</html>
