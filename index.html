<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GPS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { width: 100vw; height: 100vh; }
    #no-data {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-size: 1.5rem;
      color: #666;
    }
    .mode-ctrl { display: flex; flex-direction: column; }
    .mode-ctrl-buttons { display: flex; }
    .mode-ctrl button {
      padding: 0 12px;
      height: 36px;
      background: white;
      border: 1px solid #bbb;
      cursor: pointer;
      font-size: 13px;
      min-width: 58px;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .mode-ctrl-buttons button:not(:last-child) { border-right: none; }
    .mode-ctrl-buttons button:first-child { border-radius: 4px 0 0 4px; }
    .mode-ctrl-buttons button:last-child  { border-radius: 0 4px 4px 0; }
    .mode-ctrl-range {
      display: none;
      margin-top: 4px;
      background: white;
      border: 1px solid #bbb;
      border-radius: 4px;
      padding: 4px 8px;
      align-items: center;
      gap: 6px;
      color: #555;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .mode-ctrl-range.active { display: flex; }
    .mode-ctrl-range input[type="date"] {
      border: 1px solid #bbb;
      border-radius: 3px;
      font-size: 13px;
      padding: 2px 4px;
      height: 28px;
      width: 118px;
      font-family: inherit;
    }
    .mode-ctrl-fetch {
      border-radius: 4px;
      height: 28px;
      padding: 0 10px;
      background: white;
      border: 1px solid #bbb;
      cursor: pointer;
      font-size: 13px;
    }
    .mode-ctrl-fetch:disabled { color: #999; cursor: default; }
    .mode-ctrl button.active {
      background: #1a6fcc;
      color: white;
      border-color: #1a6fcc;
    }
    @media (max-width: 768px) {
      .mode-ctrl button {
        height: 88px;
        font-size: 30px;
        min-width: 132px;
        padding: 0 28px;
      }
    }
    .mode-ctrl-date {
      background: white;
      border: 1px solid #bbb;
      border-top: none;
      border-radius: 0 0 4px 4px;
      font-size: 11px;
      color: #555;
      padding: 3px 6px 4px;
      text-align: center;
    }
    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.6;
    }
    .leaflet-popup-content a { color: #1a6fcc; }
    .mode-ctrl-view { margin-top: 4px; }
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      z-index: 9999;
      gap: 16px;
      font-size: 1.2rem;
      color: #666;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 4px solid #ddd;
      border-top-color: #1a6fcc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- doGet() がHTMLのみ即返却するため、ページ読み込み直後にこのスピナーが表示される。
       データは google.script.run.getPoints() で非同期取得し、完了後に地図を構築する。 -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div>読み込み中...</div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.parentNode.removeChild(el);
    }

    function buildMap(points) {
      if (points.length === 0) {
        hideLoading();
        document.getElementById('map').innerHTML = '<div id="no-data">データがありません</div>';
        return;
      }

      var last = points[points.length - 1];
      // GASウェブアプリはviewportを980pxに固定するため window.innerWidth が常に980を返す。
      // そのためCSSの @media (max-width:768px) も機能しない。
      // window.screen.width は端末の物理CSS幅を返すため、こちらでスマホ判定する。
      var isMobile = window.screen.width <= 768;
      if (isMobile) {
        var s = document.createElement('style');
        s.textContent = '.leaflet-popup-content { font-size: 30px; }';
        document.head.appendChild(s);
      }
      var initialZoom  = isMobile ? 17 : 15;
      var markerRadius = isMobile ? 18 : 7;
      var iconSize     = isMobile ? 48 : 18;
      var iconAnchor   = isMobile ? 24 : 9;
      var popupAnchor  = isMobile ? -24 : -9;

      var map = L.map('map').setView([last.lat, last.lng], initialZoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).once('load', hideLoading).addTo(map);

      function formatDatetime(iso) {
        if (!iso) return '';
        var jst = new Date(new Date(iso).getTime() + 9 * 60 * 60 * 1000);
        var y  = jst.getUTCFullYear();
        var mo = ('0' + (jst.getUTCMonth() + 1)).slice(-2);
        var d  = ('0' + jst.getUTCDate()).slice(-2);
        var h  = ('0' + jst.getUTCHours()).slice(-2);
        var mi = ('0' + jst.getUTCMinutes()).slice(-2);
        return y + '/' + mo + '/' + d + ' ' + h + ':' + mi;
      }

      var latestIso = points.reduce(function(max, p) {
        return p.datetime && p.datetime > max ? p.datetime : max;
      }, '');
      var latestDateStr = latestIso ? formatDatetime(latestIso).slice(0, 10) : '';

      var now = new Date();
      var gpsToday = L.layerGroup();
      var gpsWeek  = L.layerGroup();
      var gpsRange = L.layerGroup();
      var tmpToday = L.layerGroup();
      var tmpWeek  = L.layerGroup();
      var tmpRange = L.layerGroup();
      var gpsLayers = [gpsToday, gpsWeek, gpsRange];
      var tmpLayers = [tmpToday, tmpWeek, tmpRange];
      var currentView   = 'gps';
      var currentPeriod = 0;

      function makeColor(p) {
        var tDay = Math.max(0, 1 - p.daysAgo / 3);
        var r = Math.round(0x80 + (0x1a - 0x80) * tDay);
        var g = Math.round(0x80 + (0x6f - 0x80) * tDay);
        var b = Math.round(0x80 + (0xcc - 0x80) * tDay);
        if (p.datetime) {
          var ageMin = (now - new Date(p.datetime)) / 60000;
          if (ageMin >= 0 && ageMin < 180) {
            var red    = [0xcc, 0x1a, 0x1a];
            var yellow = [0xcc, 0xcc, 0x00];
            var green  = [0x1a, 0xcc, 0x1a];
            var day    = [r, g, b];
            var seg, c1, c2;
            if      (ageMin < 30)  { c1 = red;    c2 = red;    seg = 0; }
            else if (ageMin < 60)  { c1 = red;    c2 = yellow; seg = (ageMin - 30) / 30; }
            else if (ageMin < 90)  { c1 = yellow; c2 = yellow; seg = 0; }
            else if (ageMin < 120) { c1 = yellow; c2 = green;  seg = (ageMin - 90) / 30; }
            else if (ageMin < 150) { c1 = green;  c2 = green;  seg = 0; }
            else                   { c1 = green;  c2 = day;    seg = (ageMin - 150) / 30; }
            r = Math.round(c1[0] + (c2[0] - c1[0]) * seg);
            g = Math.round(c1[1] + (c2[1] - c1[1]) * seg);
            b = Math.round(c1[2] + (c2[2] - c1[2]) * seg);
          }
        }
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }

      function makeTempColor(temp) {
        if (temp <= 15) {
          // 白(0°C以下) → 青(15°C)
          var t = Math.max(0, temp) / 15;
          return 'rgb(' + Math.round(255 - 244 * t) + ',' + Math.round(255 - 244 * t) + ',' + Math.round(255 - 37 * t) + ')';
        } else if (temp <= 35) {
          // 青(15°C) → 赤(35°C)
          var t = (temp - 15) / 20;
          return 'hsl(' + Math.round(240 - 240 * t) + ',90%,45%)';
        } else {
          // 赤(35°C) → 紫(40°C)
          var t = Math.min(1, (temp - 35) / 5);
          return 'hsl(' + Math.round(360 - 60 * t) + ',90%,45%)';
        }
      }

      function makeGpsMarker(p, datetimeStr) {
        var marker;
        if (p.name) {
          marker = L.marker([p.lat, p.lng], {
            icon: L.icon({
              iconUrl: 'https://raw.githubusercontent.com/kimiko0217/kintone_gps_map/main/images/michinoeki.png',
              iconSize: [iconSize, iconSize],
              iconAnchor: [iconAnchor, iconAnchor],
              popupAnchor: [0, popupAnchor]
            })
          });
        } else if (p.star) {
          var starPx = isMobile ? 50 : 22;
          var starHalf = isMobile ? 25 : 11;
          marker = L.marker([p.lat, p.lng], {
            icon: L.divIcon({
              html: '<div style="font-size:' + starPx + 'px;line-height:1;">⭐</div>',
              className: '',
              iconSize: [starPx, starPx],
              iconAnchor: [starHalf, starHalf],
              popupAnchor: [0, -starHalf]
            })
          });
        } else {
          var color = makeColor(p);
          marker = L.circleMarker([p.lat, p.lng], {
            radius: markerRadius,
            color: color,
            fillColor: color,
            fillOpacity: 0.8
          });
        }
        var popup = [];
        if (datetimeStr) popup.push(datetimeStr);
        if (p.name) {
          popup.push('道の駅 ' + p.name);
          popup.push('<a href="https://www.google.com/maps/search/?api=1&query=道の駅+' + encodeURIComponent(p.name) + '" target="_blank">Googleマップで見る</a>');
        } else {
          popup.push('<a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng + '" target="_blank">Googleマップで見る</a>');
        }
        marker.bindPopup(popup.join('<br>'));
        return marker;
      }

      function makeTmpMarker(p, datetimeStr) {
        if (p.temp == null || isNaN(p.temp)) return null;
        var tColor = makeTempColor(p.temp);
        var marker = L.circleMarker([p.lat, p.lng], {
          radius: markerRadius,
          color: tColor,
          fillColor: tColor,
          fillOpacity: 0.8
        });
        var popup = [];
        if (datetimeStr) popup.push(datetimeStr);
        popup.push(p.temp.toFixed(1) + '°C');
        popup.push('<a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng + '" target="_blank">Googleマップで見る</a>');
        marker.bindPopup(popup.join('<br>'));
        return marker;
      }

      function buildRangeLayers(pts) {
        gpsRange.clearLayers();
        tmpRange.clearLayers();
        pts.forEach(function(p) {
          var dStr = p.datetime ? formatDatetime(p.datetime) : '';
          gpsRange.addLayer(makeGpsMarker(p, dStr));
          var tm = makeTmpMarker(p, dStr);
          if (tm) tmpRange.addLayer(tm);
        });
      }

      points.forEach(function(p) {
        var dStr = p.datetime ? formatDatetime(p.datetime) : '';
        var gm = makeGpsMarker(p, dStr);
        gpsWeek.addLayer(gm);
        if (p.daysAgo === 0) gpsToday.addLayer(gm);
        var tm = makeTmpMarker(p, dStr);
        if (tm) {
          tmpWeek.addLayer(tm);
          if (p.daysAgo === 0) tmpToday.addLayer(tm);
        }
      });

      gpsLayers[currentPeriod].addTo(map);

      var ModeControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function() {
          var div = L.DomUtil.create('div', 'mode-ctrl');

          var periodRow = L.DomUtil.create('div', 'mode-ctrl-buttons', div);
          periodRow.innerHTML =
            '<button data-mode="0" class="active">直近1日</button>' +
            '<button data-mode="1">直近1週</button>' +
            '<button data-mode="2">期間指定</button>';

          var rangeRow = L.DomUtil.create('div', 'mode-ctrl-range', div);
          var fromInput = document.createElement('input');
          fromInput.type = 'date';
          var sep = document.createElement('span');
          sep.textContent = '〜';
          var toInput = document.createElement('input');
          toInput.type = 'date';
          var fetchBtn = document.createElement('button');
          fetchBtn.className = 'mode-ctrl-fetch';
          fetchBtn.textContent = '取得';
          rangeRow.appendChild(fromInput);
          rangeRow.appendChild(sep);
          rangeRow.appendChild(toInput);
          rangeRow.appendChild(fetchBtn);

          var viewRow = L.DomUtil.create('div', 'mode-ctrl-buttons mode-ctrl-view', div);
          viewRow.innerHTML =
            '<button data-view="gps" class="active">GPS</button>' +
            '<button data-view="temp">温度</button>';

          if (latestDateStr) {
            var dateDiv = L.DomUtil.create('div', 'mode-ctrl-date', div);
            dateDiv.textContent = '最終記録日: ' + latestDateStr;
            if (isMobile) {
              dateDiv.style.fontSize = '28px';
              dateDiv.style.padding = '8px 12px';
            }
          }

          L.DomEvent.disableClickPropagation(div);
          // CSSの @media クエリがGASのviewport固定(980px)により機能しないため、
          // JavaScriptで直接インラインスタイルを設定してスマホ用サイズを適用する。
          if (isMobile) {
            [periodRow, viewRow].forEach(function(row) {
              row.querySelectorAll('button').forEach(function(btn) {
                btn.style.height = 'auto';
                btn.style.fontSize = '45px';
                btn.style.minWidth = '0';
                btn.style.padding = '24px';
              });
            });
            [fromInput, toInput].forEach(function(input) {
              input.style.fontSize = '32px';
              input.style.height = '70px';
              input.style.width = '240px';
              input.style.padding = '8px';
            });
            fetchBtn.style.fontSize = '36px';
            fetchBtn.style.height = '70px';
            fetchBtn.style.padding = '0 20px';
            sep.style.fontSize = '36px';
          }

          periodRow.querySelectorAll('button').forEach(function(btn) {
            L.DomEvent.on(btn, 'click', function() {
              var mode = parseInt(btn.dataset.mode);
              var activeLayers = currentView === 'gps' ? gpsLayers : tmpLayers;
              map.removeLayer(activeLayers[currentPeriod]);
              currentPeriod = mode;
              activeLayers[currentPeriod].addTo(map);
              periodRow.querySelectorAll('button').forEach(function(b) {
                b.classList.toggle('active', parseInt(b.dataset.mode) === currentPeriod);
              });
              rangeRow.classList.toggle('active', currentPeriod === 2);
            });
          });

          L.DomEvent.on(fetchBtn, 'click', function() {
            var fromStr = fromInput.value;
            var toStr = toInput.value;
            if (!fromStr || !toStr) return;
            fetchBtn.textContent = '取得中...';
            fetchBtn.disabled = true;
            google.script.run
              .withSuccessHandler(function(pts) {
                buildRangeLayers(pts);
                if (currentPeriod === 2) {
                  var lrs = currentView === 'gps' ? gpsLayers : tmpLayers;
                  map.removeLayer(lrs[2]);
                  lrs[2].addTo(map);
                }
                fetchBtn.textContent = '取得';
                fetchBtn.disabled = false;
              })
              .withFailureHandler(function() {
                fetchBtn.textContent = '取得';
                fetchBtn.disabled = false;
              })
              .getPointsByRange(fromStr, toStr);
          });

          viewRow.querySelectorAll('button').forEach(function(btn) {
            L.DomEvent.on(btn, 'click', function() {
              var oldLayers = currentView === 'gps' ? gpsLayers : tmpLayers;
              map.removeLayer(oldLayers[currentPeriod]);
              currentView = btn.dataset.view;
              var newLayers = currentView === 'gps' ? gpsLayers : tmpLayers;
              newLayers[currentPeriod].addTo(map);
              viewRow.querySelectorAll('button').forEach(function(b) {
                b.classList.toggle('active', b.dataset.view === currentView);
              });
            });
          });

          return div;
        }
      });
      map.addControl(new ModeControl());
    }

    // doGet() がHTMLのみ即返却するため、データはここで非同期取得する。
    // withFailureHandler でエラー時もスピナーを消してフリーズを防ぐ。
    google.script.run
      .withSuccessHandler(buildMap)
      .withFailureHandler(hideLoading)
      .getPoints();
  </script>
</body>
</html>
